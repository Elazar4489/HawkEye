# One origin for the browser: static React build + reverse proxy to the backends.
# Works the same from http://localhost:3000 and from http://<LAN-IP>:3000.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Resolve container names at request time (no failure if a backend restarts)
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $tracking_api http://flight-tracking-api:5000;
    set $dashboard_api http://flight-dashboard-api:5000;

    client_max_body_size 5m;

    # FlightTracking.Api: auth, users, zones, alerts, live flights, admin
    location /api/ {
        proxy_pass $tracking_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SignalR (WebSockets, with long-polling fallback)
    location /notificationHub {
        proxy_pass $tracking_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    # FlightDashboardApi: /dashboard/api/... -> /api/...
    location /dashboard/ {
        rewrite ^/dashboard/(.*)$ /$1 break;
        proxy_pass $dashboard_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
    }

    # Long cache for hashed build assets, none for index.html
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
